<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Breaking // Countdown</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600&display=swap');

    :root{
        --neon-cyan: #00fff2;
        --neon-pink: #ff00e5;
        --neon-purple: #8a2be2;
        --neon-amber: #ffb300;
        --bg-deep: #05050f;
    }

    * { box-sizing: border-box; }

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        background: var(--bg-deep);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Animated grid floor */
    .grid-bg {
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(0,255,242,0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,255,242,0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0;
        animation: gridMove 8s linear infinite;
        mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
    }
    @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 40px 40px; }
    }

    /* Ambient glow orbs */
    .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        z-index: 0;
        animation: drift 12s ease-in-out infinite alternate;
    }
    .orb1 { width: 400px; height: 400px; background: var(--neon-cyan); top: -100px; left: -100px; }
    .orb2 { width: 350px; height: 350px; background: var(--neon-pink); bottom: -100px; right: -80px; animation-delay: 2s; }
    .orb3 { width: 300px; height: 300px; background: var(--neon-purple); top: 50%; left: 60%; animation-delay: 4s; }
    @keyframes drift {
        0% { transform: translate(0,0) scale(1); }
        100% { transform: translate(30px,-30px) scale(1.15); }
    }

    /* Scanline overlay */
    .scanlines {
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.02) 1px,
            transparent 2px,
            transparent 4px
        );
        pointer-events: none;
        z-index: 5;
        mix-blend-mode: overlay;
    }

    /* Particle canvas for click bursts + floating food */
    #food-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 3;
        pointer-events: none;
    }

    .food-item {
        position: absolute;
        font-size: 2.6rem;
        top: -80px;
        cursor: pointer;
        pointer-events: auto;
        animation: fallDown linear infinite;
        filter: drop-shadow(0 0 8px var(--neon-cyan)) drop-shadow(0 0 16px rgba(0,255,242,0.4));
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        user-select: none;
    }
    .food-item:hover { transform: scale(1.4) rotate(15deg) !important; filter: drop-shadow(0 0 14px var(--neon-pink)); }
    .food-pop { animation: popFood 0.35s forwards !important; }

    @keyframes popFood {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.8; }
        100% { transform: scale(0); opacity: 0; }
    }
    @keyframes fallDown {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Main HUD card */
    .timer-card {
        position: relative;
        z-index: 10;
        background: rgba(10, 12, 30, 0.55);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(0,255,242,0.35);
        border-radius: 24px;
        padding: 50px 60px 40px;
        text-align: center;
        box-shadow:
            0 0 30px rgba(0,255,242,0.25),
            0 0 80px rgba(138,43,226,0.15),
            inset 0 0 40px rgba(0,255,242,0.05);
        transition: transform 0.15s ease-out, box-shadow 0.3s ease;
        max-width: 90vw;
    }
    .timer-card::before, .timer-card::after {
        content: '';
        position: absolute;
        width: 26px; height: 26px;
        border: 2px solid var(--neon-cyan);
        opacity: 0.8;
    }
    .timer-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .timer-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    .header {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.15rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--neon-cyan);
        margin-bottom: 8px;
        text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0,255,242,0.5);
    }
    .subheader {
        font-size: 0.85rem;
        color: rgba(255,255,255,0.4);
        letter-spacing: 2px;
        margin-bottom: 30px;
        text-transform: uppercase;
    }

    .time-display {
        font-family: 'Orbitron', sans-serif;
        font-size: 4.2rem;
        font-weight: 800;
        color: #fff;
        display: flex;
        gap: 18px;
        justify-content: center;
        align-items: flex-end;
    }
    .time-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(0,255,242,0.06);
        border: 1px solid rgba(0,255,242,0.3);
        padding: 14px 20px;
        border-radius: 14px;
        min-width: 110px;
        text-shadow: 0 0 12px var(--neon-cyan), 0 0 30px rgba(0,255,242,0.6);
        position: relative;
        overflow: hidden;
    }
    .time-box::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,255,242,0.15), transparent 60%);
        pointer-events: none;
    }
    .label {
        font-family: 'Rajdhani', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 3px;
        color: rgba(0,255,242,0.6);
        margin-top: 6px;
        text-transform: uppercase;
        text-shadow: none;
    }
    .colon {
        display: flex;
        align-items: center;
        padding-bottom: 34px;
        color: var(--neon-pink);
        font-family: 'Orbitron', sans-serif;
        font-size: 3rem;
        text-shadow: 0 0 10px var(--neon-pink);
        animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* Progress ring */
    .ring-wrap {
        margin-top: 34px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        font-size: 0.85rem;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.5);
        text-transform: uppercase;
    }
    .progress-track {
        flex: 1;
        max-width: 320px;
        height: 6px;
        background: rgba(255,255,255,0.08);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(0,255,242,0.2);
    }
    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-pink));
        background-size: 200% 100%;
        animation: shimmer 3s linear infinite;
        border-radius: 4px;
        transition: width 1s linear;
    }
    @keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

    #complete-message {
        display: none;
        font-family: 'Orbitron', sans-serif;
        font-size: 2.4rem;
        color: var(--neon-amber);
        font-weight: 800;
        text-shadow: 0 0 20px var(--neon-amber), 0 0 50px rgba(255,179,0,0.6);
        animation: pulseGlow 1.2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
        0%, 100% { text-shadow: 0 0 20px var(--neon-amber), 0 0 50px rgba(255,179,0,0.6); }
        50% { text-shadow: 0 0 35px var(--neon-amber), 0 0 80px rgba(255,179,0,0.9); }
    }

    /* Modal */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(2,2,10,0.7);
        backdrop-filter: blur(8px);
        z-index: 100;
        justify-content: center;
        align-items: center;
    }
    .modal-box {
        background: rgba(10,12,30,0.9);
        border: 1px solid rgba(0,255,242,0.4);
        padding: 34px 40px;
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(0,255,242,0.3), 0 0 100px rgba(255,0,229,0.15);
        text-align: center;
        max-width: 400px;
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .modal-box h2 {
        font-family: 'Orbitron', sans-serif;
        color: var(--neon-cyan);
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-shadow: 0 0 10px var(--neon-cyan);
        line-height: 1.6;
    }
    .close-btn {
        margin-top: 22px;
        padding: 10px 30px;
        background: transparent;
        color: var(--neon-pink);
        border: 1px solid var(--neon-pink);
        border-radius: 30px;
        cursor: pointer;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: all 0.25s ease;
    }
    .close-btn:hover {
        background: var(--neon-pink);
        color: #05050f;
        box-shadow: 0 0 20px var(--neon-pink);
    }

    /* click ripple */
    .ripple {
        position: fixed;
        width: 10px; height: 10px;
        border-radius: 50%;
        border: 2px solid var(--neon-cyan);
        pointer-events: none;
        z-index: 50;
        animation: rippleOut 0.6s ease-out forwards;
    }
    @keyframes rippleOut {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(12); opacity: 0; }
    }

    .hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.35);
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        z-index: 10;
        font-family: 'Rajdhani', sans-serif;
    }
</style>

            showPopup();
            spawnRipple(e.clientX, e.clientY);
            this.classList.add('food-pop');
            setTimeout(() => this.remove(), 300);

        setTimeout(() => { if (food.parentElement) food.remove(); }, duration * 1000);
    }

    const card = document.getElementById('card');
    document.addEventListener('mousemove', (e) => {
        const relX = (e.clientX / window.innerWidth - 0.5) * 2;
        const relY = (e.clientY / window.innerHeight - 0.5) * 2;
        card.style.transform = `rotateY(${relX * 4}deg) rotateX(${-relY * 4}deg)`;
    });
    document.body.style.perspective = '1000px';

    // click ripple anywhere on screen
    document.addEventListener('click', (e) => spawnRipple(e.clientX, e.clientY));

    // Timer logic
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const clockEl = document.getElementById('clock');
    const headerEl = document.getElementById('header-text');
    const subheaderEl = document.querySelector('.subheader');
    const completeMsg = document.getElementById('complete-message');
    const progressWrap = document.getElementById('progress-wrap');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');

    function updateTimer() {
        const now = new Date();
        const diff = targetTime - now;

        if (diff <= 0) {
            clockEl.style.display = 'none';
            headerEl.style.display = 'none';
            subheaderEl.style.display = 'none';
            progressWrap.style.display = 'none';
            completeMsg.style.display = 'block';
            return;
        }

        hoursEl.innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
        minutesEl.innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        secondsEl.innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

        const totalWindow = targetTime - startTime;
        const elapsed = now - startTime;
        let pct = (elapsed / totalWindow) * 100;
        pct = Math.max(0, Math.min(100, pct));
        progressFill.style.width = pct + '%';
        progressLabel.innerText = Math.round(pct) + '%';
    }

    setInterval(updateTimer, 1000);
