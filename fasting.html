<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Breaking Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #f6d365, #fda085);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Modal Popup Styling --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* --- Existing Elements --- */
        #food-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; 
        }

        .food-item {
            position: absolute;
            font-size: 3rem;
            top: -80px; 
            cursor: pointer;
            pointer-events: auto;
            animation: fallDown linear infinite;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .food-item:hover { transform: scale(1.3) rotate(15deg) !important; }
        .food-pop { animation: popFood 0.3s forwards !important; }

        @keyframes popFood {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .timer-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 70px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s ease-out;
        }

        .header { font-size: 1.8rem; color: #ff6b6b; margin-bottom: 25px; font-weight: 600; }
        .time-display { font-size: 6rem; font-weight: 600; color: #4a4a4a; display: flex; gap: 20px; justify-content: center; }
        .time-box { display: flex; flex-direction: column; align-items: center; background: #ffffff; padding: 10px 20px; border-radius: 20px; }
        .label { font-size: 1.2rem; color: #a0a0a0; }
        .colon { display: flex; align-items: center; padding-bottom: 40px; color: #ff6b6b; }
        #complete-message { display: none; font-size: 3rem; color: #ff6b6b; font-weight: 600; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 id="modal-text">Calculating...</h2>
            <button class="close-btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <div id="food-canvas"></div>

    <div class="timer-card" id="card">
        <div class="header" id="header-text">Waiting to break the fast...</div>
        
        <div class="time-display" id="clock">
            <div class="time-box"><span id="hours">00</span><span class="label">Hours</span></div>
            <span class="colon">:</span>
            <div class="time-box"><span id="minutes">00</span><span class="label">Minutes</span></div>
            <span class="colon">:</span>
            <div class="time-box"><span id="seconds">00</span><span class="label">Seconds</span></div>
        </div>

        <div id="complete-message">Time to Eat! 🎉</div>
    </div>

    <script>
        const targetTime = new Date();
        targetTime.setHours(21, 45, 36, 0);

        const foodCanvas = document.getElementById('food-canvas');
        const modal = document.getElementById('modal');
        const modalText = document.getElementById('modal-text');
        const safeFoods = ['🍕', '🧀', '🍦', '🥛', '🍰', '🥯', '🥞', '☕', '🍲']; 

        function closeModal() {
            modal.style.display = 'none';
        }

        function showPopup() {
            const now = new Date();
            const diff = targetTime - now;
            if (diff > 0) {
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                modalText.innerText = `You still have ${h} hours, ${m} minutes, and ${s} seconds until you can eat!`;
                modal.style.display = 'flex';
            }
        }

        function createFloatingFood() {
            const food = document.createElement('div');
            food.classList.add('food-item');
            food.innerText = safeFoods[Math.floor(Math.random() * safeFoods.length)];
            food.style.left = Math.random() * 90 + 'vw';
            const duration = Math.random() * 10 + 15; 
            food.style.animationDuration = duration + 's';
            
            food.addEventListener('mousedown', function() {
                showPopup();
                this.classList.add('food-pop');
                setTimeout(() => this.remove(), 300);
            });

            foodCanvas.appendChild(food);
            setTimeout(() => { if (food.parentElement) food.remove(); }, duration * 1000);
        }

        let foodInterval = setInterval(createFloatingFood, 1000);

        // Timer Logic
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const clockEl = document.getElementById('clock');
        const headerEl = document.getElementById('header-text');
        const completeMsg = document.getElementById('complete-message');

        function updateTimer() {
            const now = new Date();
            const diff = targetTime - now;
            if (diff <= 0) {
                clockEl.style.display = 'none';
                headerEl.style.display = 'none';
                completeMsg.style.display = 'block';
                return;
            }
            hoursEl.innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            minutesEl.innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            secondsEl.innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
