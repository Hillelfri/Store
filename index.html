<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroTech | Next-Gen Electronics</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary-blue: #0f172a;
            --accent-orange: #ff9900;
            --neon-cyan: #00f2ff;
            --glass: rgba(15, 23, 42, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Interactive Data Mesh Canvas */
        #data-mesh {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        header { 
            background: #232f3e; 
            padding: 10px 40px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            position: relative;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
        }

        .logo { height: 50px; cursor: pointer; }

        .nav-links { display: flex; gap: 25px; font-size: 14px; color: white; }

        .hero-container {
            position: relative;
            z-index: 10;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .welcome-card {
            background: var(--glass);
            padding: 60px;
            border-radius: 20px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            max-width: 800px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 { 
            font-size: 56px; 
            margin: 0; 
            color: white;
            text-shadow: 0 0 15px var(--neon-cyan);
            font-weight: 900;
        }

        h2 { 
            color: var(--accent-orange); 
            margin-top: 15px; 
            letter-spacing: 1px;
            font-weight: 500;
            font-size: 24px;
        }

        p { 
            color: #d1d1d1; 
            line-height: 1.6; 
            margin: 30px 0;
            font-size: 1.2rem;
        }

        .btn-store {
            display: inline-block;
            padding: 18px 45px;
            background: var(--accent-orange);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
            transition: 0.3s;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
        }

        .btn-store:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.6);
            background: #ffb84d;
        }
    </style>
</head>
<body>

    <canvas id="data-mesh"></canvas>

    <header>
        <img src="logo.png" alt="ElectroTech Logo" class="logo" onclick="window.location.reload()">
        <div class="nav-links">
            <span onclick="alert('Your cart is currently empty.')" style="font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer;">
                🛒 Cart (0)
            </span>
        </div>
    </header>

    <div class="hero-container">
        <div class="welcome-card">
            <h1>Welcome To ElectroTech</h1>
            <h2>Precision Engineered. Digitally Delivered.</h2>
            
            <p>
                Step into our digital warehouse. Whether you are looking for high-performance components, 
                next-gen smart devices, or specialized technical gear, we are here to help you power your future.
            </p>

            <a href="store.html" class="btn-store">Navigate to Storefront</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('data-mesh');
        const ctx = canvas.getContext('2d');
        let mouse = { x: null, y: null };

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 242, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 80 }, () => new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                for (let j = i; j < particles.length; j++) {
                    const dx = p.x - particles[j].x;
                    const dy = p.y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 242, 255, ${1 - dist/150})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
                if (mouse.x) {
                    const mdx = p.x - mouse.x;
                    const mdy = p.y - mouse.y;
                    const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mDist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 153, 0, ${1 - mDist/120})`;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
