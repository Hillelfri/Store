<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Referrer Opener</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        input {
            padding: 12px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        button {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Open Site in New Tab</h2>
        <p>The destination will see this page as the referrer.</p>
        <input type="text" id="urlInput" placeholder="https://example.com">
        <br>
        <button onclick="openWithReferrer()">Launch Site</button>
    </div>

    <script>
        function openWithReferrer() {
            let targetUrl = document.getElementById('urlInput').value.trim();

            if (!targetUrl) {
                alert("Please enter a URL.");
                return;
            }

            // Ensure the URL is absolute
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            /* By default, window.open sends the Referer header. 
               We do NOT add 'noreferrer' to the features string.
            */
            window.open(targetUrl, '_blank');
        }
    </script>

</body>
</html>
